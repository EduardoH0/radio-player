<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 532">

<!-- FLOOR -->
<defs>
    <!-- 400 units wide -->
    <path id="floor-section"
        d="M0 510
           L45 510
           L65 500
           L105 510
           L165 510
           L190 520
           L225 515
           L285 510
           L305 503
           L340 510
           L400 510"
        fill="none"
        stroke="currentColor"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"
    />
</defs>

<g transform="translate(0 -10)">
    <g>
        <use href="#floor-section" x="-400"/>
        <use href="#floor-section" x="0"/>
        <use href="#floor-section" x="400"/>
        <use href="#floor-section" x="800"/>

        <animateTransform
            attributeName="transform"
            type="translate"
            from="0 0"
            to="400 0"
            dur="2.5s"
            repeatCount="indefinite"
        />
    </g>
</g>

    <g transform="translate(0 50)">
        
        <g>
            <!-- VAN -->
            <path d="M470 400 L470 380 L485 360 L485 345 L470 325 L470 150 L150 150 L80 250 
            Q 45 275 50 325 L35 345 L35 360 L50 380 L50 400
            L100 400 A 1 1 0 1 1 230 400 L300 400 A 1 1 0 1 1 430 400 Z"
                fill="currentColor" stroke="currentColor" stroke-width="25"/>
            <!-- WINDOW -->
            <path d="M80 250 L220 250 L220 150 L150 150 Z" 
                fill="#f5c400" stroke="currentColor" stroke-width="25"/>
            <!-- WHEELS -->
            <circle r="30" cx="165" cy="400" fill="none" stroke="currentColor" stroke-width="25"/>
            <circle r="30" cx="365" cy="400" fill="none" stroke="currentColor" stroke-width="25"/>
            <!-- ANTENNA -->
            <path d="M400 140 A 1 1 0 1 1 430 140 Z"
                fill="none" stroke="currentColor" stroke-width="25"/>
            <path d="M330 120 Q425 120 430 40"
                fill="none" stroke="currentColor" stroke-width="25" stroke-linecap="round"/>
            <line x1="405" y1="105" x2="365" y2="63" fill="none" stroke="currentColor" stroke-miterlimit="10" stroke-width="10"/>
            <circle r="15" cx="365" cy="63" fill="currentColor" stroke="none" stroke-width="25"/>
            <!-- ANTENNA SMALL WEAVE -->
            <path d="M310 65 Q330 10 385 10"
                fill="none" stroke="#0067ac" stroke-width="25">
                <animate
                    attributeName="opacity"
                    values="0; 1; 1; 1; 0; 0"
                    keyTimes="0; 0.20; 0.55; 0.70; 0.80; 1"
                    dur="1.5s"
                    repeatCount="indefinite"
                />
            </path>
            <!-- ANTENNA LARGE WEAVE -->
            <path d="M270 45 Q300 -35 385 -35"
                fill="none" stroke="#da001a" stroke-width="25">
                <animate
                    attributeName="opacity"
                    values="0; 0; 1; 1; 0; 0"
                    keyTimes="0; 0.35; 0.50; 0.70; 0.8; 1"
                    dur="1.5s"
                    repeatCount="indefinite"
                />
            </path>
            <!-- VAN VIBRATION -->
            <animateTransform
                attributeName="transform"
                type="rotate"
                values="
                    -1.3 256 256;
                     0.8 256 256;
                    -0.7 256 256;
                     1.7 256 256;
                     0.4 256 256;
                     1.2 256 256;
                    -0.8 256 256
                "
                keyTimes="0; 0.16; 0.32; 0.48; 0.64; 0.82; 1"
                calcMode="spline"
                keySplines="
                    0.45 0 0.55 1;
                    0.45 0 0.55 1;
                    0.45 0 0.55 1;
                    0.45 0 0.55 1;
                    0.45 0 0.55 1;
                    0.45 0 0.55 1
                "
                dur="1.8s"
                repeatCount="indefinite"
            />
        </g>
    </g>
</svg>
